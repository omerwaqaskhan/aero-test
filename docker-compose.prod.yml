# Production configuration for LuftWay Platform
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 
# IMPORTANT: Set all environment variables in .env.prod file before deployment
# Never commit .env.prod to version control

services:
  # Backend production overrides
  backend:
    environment:
      LOG_LEVEL: WARNING
      ENABLE_DEBUG_MODE: false
      SENTRY_ENVIRONMENT: production
      ENABLE_SENTRY: ${ENABLE_SENTRY:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: 0.1
      SENTRY_PROFILES_SAMPLE_RATE: 0.1
      # CORS - Production domains only
      CORS_ORIGINS: ${CORS_ORIGINS:-"https://luftway.com,https://www.luftway.com,https://admin.luftway.com"}
      # Override with production secrets (from .env.prod)
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMS_API_SECRET: ${SMS_API_SECRET}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Frontend production overrides
  frontend:
    build:
      context: ./frontend/web-vite
      dockerfile: Dockerfile
      target: production
    ports:
      - "3001:80"
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # PostgreSQL production overrides
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-luftway_auth_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Redis production overrides
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Nginx production overrides
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

# Production volumes with proper drivers
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
